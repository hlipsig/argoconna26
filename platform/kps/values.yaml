# kube-prometheus-stack 92.14.0 (Prometheus v3.15.1, Grafana 13.2.4) sized for kind.
# Needs the grafana-admin Secret from scripts/secrets.sh (build-all runs secrets before kps).
fullnameOverride: kps

alertmanager:
  enabled: false

# node-exporter saves RAM on kind
nodeExporter:
  enabled: false

# kind's control-plane components are not scrapeable; their targets would only be noise
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 2d
    # D6: pick up ServiceMonitors, PodMonitors, rules and probes from every namespace and label
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: NodePort
    nodePort: 30030
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    # Grafana 13 gzips API responses by default, and its pgzip writers leak: a heap profile
    # under the 5 s kiosk refresh showed 70% of the growth in pgzip buffers, and Grafana was
    # OOMKilled every few minutes. Everything here is on localhost, so compression buys nothing.
    server:
      enable_gzip: false
  # Annotations (written by cdevents-sim) live in Grafana's database: keep it across restarts.
  # Do not rebuild between a recorded rung-3 run and its review (Task 3.13 Step 2).
  persistence:
    enabled: true
    size: 1Gi
  # one Grafana pod on one volume: stop the old pod before the new one starts
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  # Infinity reads cdevents-sim's HTTP API for the events table (INFINITY_PLUGIN_VERSION in versions.env).
  plugins:
    - yesoreyeram-infinity-datasource@4.1.3
  additionalDataSources:
    - name: cdevents-sim
      uid: cdevents-sim
      type: yesoreyeram-infinity-datasource
      access: proxy
      jsonData:
        auth_method: none
        allowedHosts:
          - http://cdevents-sim.aiops.svc:8080
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  # Headroom over Grafana 13's ~250Mi idle; GOMEMLIMIT makes the GC work harder before the
  # cgroup limit. The OOM itself was the gzip leak above.
  extraConfigmapMounts:
    - name: host-trust
      configMap: demo-ca-bundle
      mountPath: /trust
      readOnly: true
  env:
    SSL_CERT_FILE: /trust/ca-bundle.pem
    GOMEMLIMIT: 768MiB
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
