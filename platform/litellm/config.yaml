# Proxy config, merged into the chart values. Subscription quotas are held by ChatGPT.
# Both aliases use the signed-in ChatGPT subscription. Dollar spend is not metered
# by this provider; rate limits below bound calls instead.
proxy_config:
  model_list:
    - model_name: rca
      litellm_params:
        model: chatgpt/gpt-6.1-sol
        rpm: 10
        tpm: 100000
    - model_name: judge
      litellm_params:
        model: chatgpt/gpt-6.1-sol
        rpm: 5
        tpm: 50000
  litellm_settings:
    callbacks: [chatgpt_schema.schema_compat]
  router_settings:
    num_retries: 2
    request_timeout: 120
    allowed_fails: 2
    cooldown_time: 30
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    # every call is kept in the spend log (what's real: LiteLLM logs each call)
    store_prompts_in_spend_logs: true
