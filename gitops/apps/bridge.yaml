apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bridge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hlipsig/argoconna26.git
    targetRevision: main
    path: bridge/deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
